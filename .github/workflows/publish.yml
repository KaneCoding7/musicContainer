name: Publish images

# Builds the backend + frontend images and pushes them to Docker Hub.
#
# Every run publishes ONE immutable build tag, shared by backend + frontend:
#     build-<run_id>-<sha7>      unique per run; the workflow fails rather than overwrite it
# plus convenience tags:
#   - push to main / dispatch -> :latest (moving) and :sha-<sha7> (only if that tag does not exist
#                                yet, so it always points at the FIRST build of a commit)
#   - weekly cron             -> :latest only (a fresh rebuild never re-points an existing :sha-*)
#   - pull request            -> BUILD ONLY (validates the Dockerfiles, amd64); nothing is pushed,
#                                so unreviewed code never reaches Docker Hub
# Deployments never use moving tags: deploy.sh resolves build-*/sha-* to a sha256 digest and pins
# that digest in the stack's .env. DEV tests a build first; PROD only accepts a digest that ran
# healthy on DEV (see deploy/README.md).
#
# The weekly rebuild exists for yt-dlp: it goes stale within weeks and a stale
# yt-dlp 403s on every "import from link", so :latest has to be rebuilt even
# when no commit lands. Containers also self-refresh yt-dlp on start, which
# covers the gap between rebuilds -- see backend/docker-entrypoint.sh.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  = mrkane7
#   DOCKERHUB_TOKEN     = a Docker Hub access token (Account Settings -> Personal
#                         access tokens -> Generate, with Read & Write scope)

on:
  push:
    branches: [main]
  pull_request:
  # Sundays 05:00 UTC. Rebuilds :latest from main so the published image picks
  # up the current yt-dlp (and any other upstream/base-image fixes).
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

# A newer push/PR update cancels an in-flight build for the same ref.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Fork PRs are skipped entirely (no secrets); same-repo PRs build without pushing.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            image: mrkane7/music-backend
          - service: frontend
            context: ./frontend
            image: mrkane7/music-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Compute tags in shell rather than docker/metadata-action so the build
      # doesn't depend on the GitHub metadata API (which can 503 during GitHub
      # incidents and fail the whole publish). Immutable tags are checked against
      # the registry first: an existing build-* tag fails the job (never overwrite),
      # an existing sha-* tag is simply not pushed again.
      - name: Compute tags (immutable build tag + guarded convenience tags)
        id: meta
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          short="$(echo "$sha" | cut -c1-7)"
          build="build-${GITHUB_RUN_ID}-${short}"
          exists() { docker buildx imagetools inspect "$IMAGE:$1" >/dev/null 2>&1; }
          if exists "$build"; then
            echo "::error::$IMAGE:$build already exists; refusing to overwrite an immutable tag"; exit 1
          fi
          tags="$IMAGE:$build"
          case "$GITHUB_EVENT_NAME" in
            pull_request) ;;   # build-only: the build tag is computed for the summary but never pushed
            schedule)     tags="$tags"$'\n'"$IMAGE:latest" ;;
            *)            tags="$tags"$'\n'"$IMAGE:latest"
                          if exists "sha-$short"; then
                            echo "::notice::$IMAGE:sha-$short already exists (first build of this commit); not re-pointing it"
                          else
                            tags="$tags"$'\n'"$IMAGE:sha-$short"
                          fi ;;
          esac
          echo "Tags:"; echo "$tags"
          { echo 'tags<<EOF'; echo "$tags"; echo 'EOF'; echo "build=$build"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"

      # Resolve the newest yt-dlp and bake that exact version into the backend
      # image. Pinning the resolved version (rather than letting the Dockerfile
      # resolve "latest" itself) keeps the build reproducible and guarantees a
      # new yt-dlp release invalidates that layer's cache. Falls back to
      # "latest" if PyPI is unreachable, so a PyPI blip can't fail the publish.
      - name: Resolve latest yt-dlp
        id: ytdlp
        if: matrix.service == 'backend'
        run: |
          version="$(curl -fsSL --max-time 30 https://pypi.org/pypi/yt-dlp/json \
            | jq -re '.info.version' 2>/dev/null || true)"
          if [ -z "$version" ]; then
            echo "PyPI lookup failed; falling back to YTDLP_VERSION=latest"
            version=latest
          fi
          echo "yt-dlp version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.build }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: ${{ matrix.service == 'backend' && format('YTDLP_VERSION={0}', steps.ytdlp.outputs.version) || '' }}

      # The digest is what deploy.sh pins. Print it where it is easy to copy.
      - name: Build summary
        env:
          IMAGE: ${{ matrix.image }}
          BUILD: ${{ steps.meta.outputs.build }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "### $IMAGE: PR build OK (not published)" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          {
            echo "### $IMAGE"
            echo "- build tag: \`$BUILD\`"
            echo "- digest: \`$IMAGE@$DIGEST\`"
            echo "- deploy to DEV: \`sudo music-deploy dev --build $BUILD\`"
          } >> "$GITHUB_STEP_SUMMARY"
