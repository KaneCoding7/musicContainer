name: Publish images

# Builds the backend + frontend images and pushes them to Docker Hub.
#   - push to main  -> tag :latest  (the images others pull to run the app)
#   - pull request  -> tag :dev     (a rolling preview build to test before merge)
#   - weekly cron   -> tag :latest  (rebuild so a published image never rots)
#
# The weekly rebuild exists for yt-dlp: it goes stale within weeks and a stale
# yt-dlp 403s on every "import from link", so :latest has to be rebuilt even
# when no commit lands. Containers also self-refresh yt-dlp on start, which
# covers the gap between rebuilds -- see backend/docker-entrypoint.sh.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  = mrkane7
#   DOCKERHUB_TOKEN     = a Docker Hub access token (Account Settings -> Personal
#                         access tokens -> Generate, with Read & Write scope)

on:
  push:
    branches: [main]
  pull_request:
  # Sundays 05:00 UTC. Rebuilds :latest from main so the published image picks
  # up the current yt-dlp (and any other upstream/base-image fixes).
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

# A newer push/PR update cancels an in-flight build for the same ref.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip publishing for PRs opened from forks: they don't have access to the
    # Docker Hub secrets, so the push would fail. Same-repo PRs still publish :dev.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            image: mrkane7/music-backend
          - service: frontend
            context: ./frontend
            image: mrkane7/music-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Compute tags in shell rather than docker/metadata-action so the build
      # doesn't depend on the GitHub metadata API (which can 503 during GitHub
      # incidents and fail the whole publish). main -> :latest + :sha-<short>;
      # pull request -> :dev.
      - name: Compute tags
        id: meta
        run: |
          short="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          {
            echo 'tags<<EOF'
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "${{ matrix.image }}:dev"
            else
              echo "${{ matrix.image }}:latest"
              echo "${{ matrix.image }}:sha-${short}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Resolve the newest yt-dlp and bake that exact version into the backend
      # image. Pinning the resolved version (rather than letting the Dockerfile
      # resolve "latest" itself) keeps the build reproducible and guarantees a
      # new yt-dlp release invalidates that layer's cache. Falls back to
      # "latest" if PyPI is unreachable, so a PyPI blip can't fail the publish.
      - name: Resolve latest yt-dlp
        id: ytdlp
        if: matrix.service == 'backend'
        run: |
          version="$(curl -fsSL --max-time 30 https://pypi.org/pypi/yt-dlp/json \
            | jq -re '.info.version' 2>/dev/null || true)"
          if [ -z "$version" ]; then
            echo "PyPI lookup failed; falling back to YTDLP_VERSION=latest"
            version=latest
          fi
          echo "yt-dlp version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ matrix.service == 'backend' && format('YTDLP_VERSION={0}', steps.ytdlp.outputs.version) || '' }}
