# /etc/music-deploy/prod.conf - playlist.mrkane.dev (PROD). Sourced by deploy.sh.
STACK_DIR=/mnt/media/stacks/marcus-music
COMPOSE_PROJECT=marcus-music
DATA_DIR=/mnt/media/appdata/marcus-music/data
BACKEND_SERVICE=backend
FRONTEND_SERVICE=frontend
BACKEND_CONTAINER=music-backend-prod
FRONTEND_CONTAINER=music-frontend-prod
BACKEND_VAR=PROD_BACKEND_IMAGE
FRONTEND_VAR=PROD_FRONTEND_IMAGE
BACKEND_REPO=mrkane7/music-backend
FRONTEND_REPO=mrkane7/music-frontend
HEALTH_URLS="http://127.0.0.1:5007/api/health http://127.0.0.1:5006/"
PUBLIC_URLS="https://playlist-api.mrkane.dev/api/health https://playlist.mrkane.dev/"
BACKUP_DIR=/mnt/media/safety/music-predeploy/prod
STATE_DIR=/var/lib/music-deploy
PROMOTE_FROM=dev          # PROD only accepts digests that ran healthy on DEV ...
SOAK_HOURS=24             # ... for at least this long
CONFIRM=yes               # interactive confirmation unless --yes
ALERT_URL=http://127.0.0.1:9093
HEALTH_TIMEOUT=240
