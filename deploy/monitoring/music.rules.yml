# ADD as a group in ~/ServerAnalytics-/infra/alerts.rules.yml (or as its own rule file)
groups:
  - name: music.rules
    rules:
      # PROD is public: page fast. 3 consecutive failed 60s probes.
      - alert: MusicProdSiteDown
        expr: probe_success{job="music-sites",env="prod"} == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: 'playlist (PROD) unreachable: {{ $labels.instance }}'
          description: 'Blackbox probe failing for 3m. Check: docker ps (music-*-prod, cloudflared-marcus), music-deploy prod --status.'
      # DEV: same signal, lower urgency and more patience (deploys/tests restart it).
      - alert: MusicDevSiteDown
        expr: probe_success{job="music-sites",env="dev"} == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'beats (DEV) unreachable: {{ $labels.instance }}'
          description: 'Blackbox probe failing for 10m. Check: docker ps (music-backend/frontend), caddy, music-deploy dev --status.'
      - alert: MusicSiteCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job="music-sites"} - time()) < 14 * 86400
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: 'TLS certificate for {{ $labels.instance }} expires in < 14 days'
          description: 'beats certs come from Caddy (check caddy logs); playlist certs come from Cloudflare.'
      - alert: MusicProbesMissing
        expr: absent(probe_success{job="music-sites"})
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'No music-site probe results for 15m (blackbox-exporter down or job removed)'
          description: 'Without probes the music site-down alerts cannot fire.'
